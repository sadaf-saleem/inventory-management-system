version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ase_inventory_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: inventory_db
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - ase_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ase_inventory_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://admin:adminpassword@mongodb:27017/inventory_db?authSource=admin
      JWT_SECRET: super_secret_enterprise_key_2026_ase
      JWT_EXPIRE: 24h
    depends_on:
      - mongodb
    networks:
      - ase_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ase_inventory_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ase_network

networks:
  ase_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
